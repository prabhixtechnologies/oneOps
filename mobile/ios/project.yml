# Xcode project spec, consumed by XcodeGen: `xcodegen generate` writes PrabhixOperator.xcodeproj.
#
# Why a spec instead of a committed .xcodeproj: the project file cannot be created or opened from
# Windows, which is the whole reason iOS is the last phase. A text spec can be written, reviewed and
# kept correct from any machine, and it removes the six-step manual setup the README used to
# describe — six steps that had to be repeated identically by every developer and produced a
# different project each time.
#
# The .xcodeproj it generates is build output and is gitignored. Regenerate it after changing this
# file or adding source files.

name: PrabhixOperator

options:
  bundleIdPrefix: com.prabhix
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # Source files are referenced in place, so adding a Swift file needs no project edit — only a
  # regenerate. Groups mirror the directory layout.
  generateEmptyDirectories: false

# Local-only settings: signing team and the API host for device builds. Copy the template first:
#   cp Config.xcconfig.template Config.xcconfig
# Generation fails with a clear error if it is missing, which is better than silently building
# something unsigned that points at the wrong backend.
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.10"
    ENABLE_USER_SCRIPT_SANDBOXING: true
    # The source has never been compiled, so warnings here are load-bearing during the first
    # shakedown. Not errors: a first build that stops at the first warning tells you far less than
    # one that reports all of them.
    GCC_TREAT_WARNINGS_AS_ERRORS: false
    SWIFT_TREAT_WARNINGS_AS_ERRORS: false
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      APS_ENVIRONMENT: development
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      APS_ENVIRONMENT: production

# ---------------------------------------------------------------------------
# Two targets from one source tree, mirroring the Android product flavors.
#
#   PrabhixOperator  com.prabhix.operator  the OneOps product sold to customers
#   PrabhixAdmin     com.prabhix.admin     the private admin app
#
# Everything below is shared except three per-target values and one compilation condition:
#
#   PRABHIX_APP_LABEL         names the app, and names it again in the sessions list
#   PRABHIX_DEVICE_HEADER     tells the backend which app a request came from
#   PRABHIX_DEEP_LINK_SCHEME  unique per app, so prabhix://chat/{id} is never ambiguous
#   PRABHIX_ADMIN             compiled into the admin target only
#
# These are the same four distinctions the Android flavors make, by the same names. Info.plist reads
# the first three through $(...) substitution and AppConfig reads them back out at runtime.
# ---------------------------------------------------------------------------

targetTemplates:
  App:
    type: application
    platform: iOS
    sources:
      - path: PrabhixOperator/PrabhixOperator
        # Excluded because the Info.plist is wired through the build setting below rather than
        # compiled as a resource, and Xcode warns when a plist appears in both roles.
        excludes:
          - Info.plist
    settings:
      base:
        INFOPLIST_FILE: PrabhixOperator/PrabhixOperator/Info.plist
        PRABHIX_API_BASE: $(API_BASE_URL)
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
    entitlements:
      path: PrabhixOperator/${target_name}.entitlements
      properties:
        # Debug builds talk to APNs sandbox, archives to production. Getting this backwards is the
        # classic "push works on my device and not from TestFlight" failure.
        aps-environment: $(APS_ENVIRONMENT)

targets:
  PrabhixOperator:
    templates: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prabhix.operator
        # PRODUCT_NAME is left as the target name, so the bundle and executable are PrabhixOperator
        # with no space in them. The name a user sees is PRABHIX_APP_LABEL, via CFBundleDisplayName.
        PRABHIX_APP_LABEL: Prabhix OneOps
        PRABHIX_DEVICE_HEADER: mobile-ios
        PRABHIX_DEEP_LINK_SCHEME: prabhix

  PrabhixAdmin:
    templates: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prabhix.admin
        PRABHIX_APP_LABEL: Prabhix Admin
        PRABHIX_DEVICE_HEADER: mobile-ios-admin
        PRABHIX_DEEP_LINK_SCHEME: prabhix-admin
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG PRABHIX_ADMIN
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: PRABHIX_ADMIN
    # When Phase 7 resumes, the platform screens go in their own directory added here and to no
    # other target, so the customer's binary does not contain them — the same arrangement as
    # app/src/admin on Android, where absence rather than a disabled flag is what keeps them out:
    #
    #   sources:
    #     - path: PrabhixOperator/Admin
    #
    # Shared code reaches them through a seam that both targets define, so only the admin copy
    # references the platform API. See mobile/android/.../ui/platform/PlatformFeature.kt.

schemes:
  PrabhixOperator:
    build:
      targets:
        PrabhixOperator: all
    run:
      config: Debug
    archive:
      config: Release
  PrabhixAdmin:
    build:
      targets:
        PrabhixAdmin: all
    run:
      config: Debug
    archive:
      config: Release
