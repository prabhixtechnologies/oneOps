server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # The entry document must never be cached. It names the content-hashed bundles, so a stale
    # copy pins the browser to an old console — and once those bundles age out of a later image
    # it asks for filenames that no longer exist and renders nothing at all. no-cache still
    # allows a conditional request, so an unchanged document costs a 304 rather than a download.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Safe to cache hard: Vite puts a content hash in every one of these filenames, so a changed
    # file is a different URL.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        include /etc/nginx/snippets/security-headers.conf;
        # Spelled out in one add_header rather than alongside `expires`, which would emit its own
        # competing Cache-Control and leave two of them on every asset response.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
