# Shared response headers for every location in web/nginx.conf.
#
# This lives in its own file because nginx's add_header inheritance is a trap: a location block
# that declares even one add_header stops inheriting *all* of the server-level ones. The asset
# location needs its own Cache-Control and index.html needs its own, so without an include both
# would quietly serve JavaScript and HTML with no CSP and no framing protection.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# CSP — allows Razorpay checkout iframe and API
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.razorpay.com http://localhost:8080 https://*.prabhixtechnologies.com; frame-src https://checkout.razorpay.com; object-src 'none'; base-uri 'self'; form-action 'self';" always;
