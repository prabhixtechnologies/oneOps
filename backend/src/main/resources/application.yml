spring:
  application:
    name: prabhix-platform

  profiles:
    default: dev

  threads:
    # Needs a Java 21 or newer runtime; production runs 25. Left off by default so the app still
    # boots on a JDK 17 built with -Djava.version=17.
    virtual:
      enabled: ${VIRTUAL_THREADS:false}

  datasource:
    # oneops, not prabhix: the database belongs to the product, and Prabhix is the company that sells
    # it. Renamed with the move to RDS, where the platform, identity and mobistack databases sit on
    # one instance and a name that says which product owns which is worth having.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oneops}
    username: ${DB_USERNAME:oneops}
    password: ${DB_PASSWORD:oneops}
    hikari:
      # Sized for many app instances behind PgBouncer rather than a few fat pools.
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      pool-name: prabhix-pool

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only verifies that it matches the entities.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    # Migrations must reach Postgres directly. PgBouncer runs in transaction pooling mode, where
    # a session-level advisory lock cannot be held across statements, so Flyway's migration lock
    # would not protect concurrent deploys.
    url: ${FLYWAY_URL:${DB_URL:jdbc:postgresql://localhost:5432/oneops}}
    user: ${FLYWAY_USER:${DB_USERNAME:oneops}}
    password: ${FLYWAY_PASSWORD:${DB_PASSWORD:oneops}}
    locations: classpath:db/migration
    # Off, matching identity: these databases are created empty, so the only thing a baseline could
    # do is mark an existing schema as already migrated and skip V1 silently. A schema that has
    # tables but no history is a mistake worth failing on, not one to paper over.
    #
    # Safe with a prepared RDS database despite the extensions an administrator creates first:
    # Flyway does not count extension-owned types and functions when deciding a schema is empty.
    baseline-on-migrate: false
    validate-on-migrate: true
    # Migrations seed Thymeleaf email templates whose bodies contain ${...} variables.
    # Flyway would try to resolve those as its own placeholders and fail the migration.
    placeholder-replacement: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
          connectiontimeout: 10000
          timeout: 20000
          writetimeout: 20000

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

  jackson:
    # Null fields are omitted from responses entirely. Clients must therefore treat an absent key and
    # a null value as the same thing — in Zod that means nullish(), not nullable(), and in Kotlin a
    # nullable property. Do not switch this to `always` to satisfy one strict schema: roughly a
    # hundred client fields are declared optional-but-not-nullable, and they reject an explicit null,
    # so emitting nulls breaks far more than it fixes. CursorPage.nextCursor opts out locally because
    # it is a protocol field clients branch on.
    default-property-inclusion: non_null
    #
    # Jackson 3 split the feature flags across several enums, and Spring binds each block below to a
    # different one. A key under the wrong block is not ignored: binding fails, the mapper cannot be
    # built, and the application does not start. Which enum each belongs to is worth stating.
    datatype:
      datetime:
        # DateTimeFeature, moved out of SerializationFeature. Left explicit even though false is now
        # the Jackson default, because ISO-8601 strings rather than epoch numbers is a contract with
        # the web and Android clients, not a preference.
        write-dates-as-timestamps: false
    mapper:
      # MapperFeature, and on by default in Jackson 3, which would reorder the keys of every response.
      # No client reads JSON positionally, so nothing should break — but it rewrites the bytes on the
      # wire for the whole API in a release whose only purpose is a framework upgrade, and that is not
      # a diff worth reasoning about when something else goes wrong.
      sort-properties-alphabetically: false
    deserialization:
      fail-on-unknown-properties: false

  # Moved here from server.error.* in the Boot 4 upgrade. The old keys bind to a different enum, so
  # Boot could not carry them across and ignored them in silence — no warning, no failure, just the
  # defaults. They happen to default to never as well, so nothing leaked, but "the safe thing was the
  # default" is luck rather than configuration and only the properties migrator revealed it.
  #
  # never on both: an error response carries a status and a correlation id, and nothing else. An
  # exception message names internal classes and often quotes the input that broke, and a stack trace
  # maps the whole application for whoever is probing it.
  web:
    error:
      include-message: never
      include-stacktrace: never

  task:
    execution:
      pool:
        core-size: 8
        max-size: 32
        queue-capacity: 500
      thread-name-prefix: pbx-task-
    scheduling:
      pool:
        size: 8
      thread-name-prefix: pbx-sched-

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
  tomcat:
    max-swallow-size: 30MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        # readinessState alone is the default, which means the readiness probe passes while the
        # cache is unreachable. deploy.sh gates the rollout on this endpoint, so that combination
        # ships a backend whose rate limiter and token deny list both fail open — revoked tokens
        # keep working and nothing says so. Cheaper to fail the deploy.
        #
        # The Dockerfile HEALTHCHECK reads this endpoint too, so an unreachable cache also marks
        # the container unhealthy. That is signal rather than a restart loop: plain Docker does not
        # restart unhealthy containers, and `restart: always` acts on process exit, not on health.
        readiness:
          include: readinessState,redis
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    # Spring's mail indicator opens an SMTP connection to spring.mail.host regardless of which
    # transport is configured, so with MAIL_TRANSPORT=SES it reports the application DOWN for
    # failing to reach a port nothing is meant to be listening on. MailTransportHealthIndicator
    # asks the router what it would actually send through, and contributes under "mailTransport".
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
  api-docs:
    path: /v3/api-docs
    # Gated by the same flag as the UI. Turning off only the UI while still serving the raw
    # document publishes every endpoint, schema and auth requirement to anyone who asks, which
    # defeats the point of disabling the UI in production. Generate mobile and TypeScript clients
    # from a local or CI instance, where this is on.
    enabled: ${SWAGGER_ENABLED:true}

logging:
  level:
    root: INFO
    com.prabhix.platform: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: WARN

# ---------------------------------------------------------------------------
# Platform configuration
# ---------------------------------------------------------------------------
prabhix:
  # Public URLs, used to build links inside emails and CORS allow-lists.
  urls:
    marketing: ${MARKETING_URL:http://localhost:3000}
    console: ${CONSOLE_URL:http://localhost:5173}
    api: ${API_URL:http://localhost:8080}

  cors:
    # 3000 marketing, 5173 OneOps console, 5174 admin console. All three send credentials, so this
    # can never become "*" — a wildcard origin is rejected by browsers for credentialed requests.
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174}

  security:
    jwt:
      # MUST be overridden outside dev. Startup fails if it is short or default in prod.
      secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789abcdefghijklmnop}
      issuer: ${JWT_ISSUER:prabhix-platform}
      access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
      refresh-token-ttl: ${JWT_REFRESH_TTL:P30D}
    # Tokens issued by Prabhix Identity, verified against its published JWKS. Blank disables it and
    # only HS256 tokens minted here are accepted, which is the state until identity is running.
    # Both families are accepted at once so the changeover signs nobody out. See docs/IDENTITY.md.
    identity:
      issuer: ${IDENTITY_ISSUER:}
      # Only if the key set is not at {issuer}/.well-known/jwks.json.
      jwks-uri: ${IDENTITY_JWKS_URI:}
      jwks-cache-ttl: ${IDENTITY_JWKS_CACHE_TTL:PT10M}
      jwks-min-refresh-interval: ${IDENTITY_JWKS_MIN_REFRESH:PT30S}
      # Where the local users mirror is filled in from. Internal address: /internal is not routed
      # publicly, and the token below is the second lock rather than the only one.
      internal-base-url: ${IDENTITY_INTERNAL_URL:http://identity:8081}
      service-token: ${IDENTITY_SERVICE_TOKEN:}
    # Sliding-window limits enforced in Redis, per IP and per organization.
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      auth-attempts-per-minute: 10
      api-requests-per-minute: 600
    password:
      min-length: 10
      bcrypt-strength: 12
    # Shared browser session. The domain must be the parent of every console hostname that should
    # share one sign-in, and empty locally, where a cookie scoped to "localhost" is what browsers
    # accept. Lifetime follows jwt.refresh-token-ttl above, so there is one knob for how long a
    # signed-in browser stays signed in.
    session-cookie:
      name: ${SESSION_COOKIE_NAME:pbx_session}
      domain: ${SESSION_COOKIE_DOMAIN:}
      secure: ${SESSION_COOKIE_SECURE:true}
      same-site: ${SESSION_COOKIE_SAME_SITE:Lax}

  otp:
    length: 6
    ttl: PT10M
    max-attempts: 5

  mail:
    # Identity used for platform-generated mail (auth, billing, notifications).
    from-address: ${MAIL_FROM:no-reply@prabhixtechnologies.com}
    from-name: ${MAIL_FROM_NAME:Prabhix Technologies}
    reply-to: ${MAIL_REPLY_TO:support@prabhixtechnologies.com}
    # LOGGING | SELF_HOSTED_SMTP | SES | SMTP_RELAY
    transport: ${MAIL_TRANSPORT:LOGGING}
    outbox:
      enabled: ${MAIL_OUTBOX_ENABLED:true}
      batch-size: 50
      poll-interval: PT5S
      max-attempts: 6
    inbound:
      # IMAP polling. Disabled by default so local dev does not need a mail server.
      imap-enabled: ${MAIL_IMAP_ENABLED:false}
      poll-interval: PT60S
      fetch-batch-size: 50
      # Shared secret Postfix/Dovecot use to push mail in over LMTP/HTTP.
      lmtp-token: ${MAIL_LMTP_TOKEN:}
    tracking:
      enabled: ${MAIL_TRACKING_ENABLED:false}
      secret: ${MAIL_TRACKING_SECRET:dev-tracking-secret}
    threading:
      # Subject token that lets replies rejoin a thread when References is stripped.
      token-prefix: PBX
      subject-fallback-window: P30D
    ses:
      region: ${SES_REGION:ap-south-1}
      # Leave blank on EC2 so the instance role supplies credentials instead of static keys.
      access-key: ${SES_ACCESS_KEY:}
      secret-key: ${SES_SECRET_KEY:}
      # Needed for SES to publish bounce and complaint events back to us.
      configuration-set: ${SES_CONFIGURATION_SET:}
    credentials:
      # Rotating this makes stored mailbox passwords unreadable; they must be re-entered.
      secret: ${MAIL_CREDENTIAL_SECRET:dev-only-mailbox-credential-key-change-me}
    domain-verification:
      recheck-enabled: ${MAIL_DOMAIN_RECHECK_ENABLED:true}
      recheck-cron: ${MAIL_DOMAIN_RECHECK_CRON:0 20 4 * * *}
      recheck-interval: ${MAIL_DOMAIN_RECHECK_INTERVAL:P1D}
      recheck-batch-size: ${MAIL_DOMAIN_RECHECK_BATCH:50}

  billing:
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
      api-base: https://api.razorpay.com/v1
    currency: INR
    # GST-compliant sequential invoice numbering.
    invoice:
      prefix: ${INVOICE_PREFIX:PBX}
      gst-percent: 18
      # Our registered state. Decides CGST+SGST (intra-state) vs IGST (inter-state).
      place-of-supply: ${INVOICE_PLACE_OF_SUPPLY:Karnataka}
      # Printed on every tax invoice. GSTIN and address are legally required on a GST
      # invoice, so set both before charging a real customer.
      supplier-name: ${INVOICE_SUPPLIER_NAME:Prabhix Technologies Pvt Ltd}
      supplier-gstin: ${INVOICE_SUPPLIER_GSTIN:}
      supplier-address: ${INVOICE_SUPPLIER_ADDRESS:}
    trial-days: 14

  site:
    # Marketing-site submissions are not tenant-scoped, but file uploads are. Set this to
    # the UUID of the Prabhix-owned organization so candidate resumes have somewhere to
    # live. While it is blank, applications are still saved and only the upload is skipped.
    internal-organization-id: ${SITE_INTERNAL_ORG_ID:}

  visitor:
    raw-retention: ${VISITOR_RAW_RETENTION:P90D}
    ingest-batch-max-events: ${VISITOR_INGEST_BATCH_MAX:50}
    ingest-max-payload-bytes: ${VISITOR_INGEST_MAX_BYTES:65536}
    presence-ttl-seconds: ${VISITOR_PRESENCE_TTL:120}
    ingest-rate-limit-per-minute: ${VISITOR_INGEST_RL_IP:60}
    ingest-rate-limit-per-visitor-per-minute: ${VISITOR_INGEST_RL_VISITOR:120}
    allowed-origins: ${VISITOR_ALLOWED_ORIGINS:http://localhost:3000}
    retention-batch-size: ${VISITOR_RETENTION_BATCH:500}
    retention-cron: ${VISITOR_RETENTION_CRON:0 15 2 * * *}

  chat:
    conversation-token-ttl: ${CHAT_TOKEN_TTL:PT24H}
    public-rate-limit-per-minute: ${CHAT_PUBLIC_RL:30}
    allowed-origins: ${CHAT_ALLOWED_ORIGINS:http://localhost:3000}
    business-hours:
      start: ${CHAT_BH_START:09:00}
      end: ${CHAT_BH_END:18:00}
      timezone: ${CHAT_BH_TZ:Asia/Kolkata}

  commerce:
    # Storefront currency is fixed per deployment; Razorpay settles in one currency.
    currency: ${COMMERCE_CURRENCY:INR}
    # Digital goods are delivered as short-lived signed links, re-issuable from the order.
    download-link-ttl: ${COMMERCE_DOWNLOAD_TTL:PT24H}
    max-download-count: ${COMMERCE_MAX_DOWNLOADS:5}
    cart-ttl: ${COMMERCE_CART_TTL:P14D}
    # Reservation held between "checkout started" and "payment captured".
    stock-hold-ttl: ${COMMERCE_STOCK_HOLD_TTL:PT15M}
    allowed-origins: ${COMMERCE_ALLOWED_ORIGINS:http://localhost:3000}
    public-rate-limit-per-minute: ${COMMERCE_PUBLIC_RL:60}

  ai:
    # Provider-agnostic by design: swapping models is configuration, not code.
    enabled: ${AI_ENABLED:true}
    default-provider: ${AI_PROVIDER:gemini}
    request-timeout: ${AI_TIMEOUT:PT30S}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:2048}
    # Per-organization ceiling so one tenant cannot spend the whole AI budget.
    monthly-token-quota: ${AI_MONTHLY_TOKEN_QUOTA:2000000}
    redact-pii: ${AI_REDACT_PII:true}
    providers:
      gemini:
        api-key: ${GEMINI_API_KEY:}
        base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
        chat-model: ${GEMINI_CHAT_MODEL:gemini-2.0-flash}
        reasoning-model: ${GEMINI_REASONING_MODEL:gemini-2.0-flash-thinking-exp}
        embedding-model: ${GEMINI_EMBEDDING_MODEL:text-embedding-004}
      openai:
        api-key: ${OPENAI_API_KEY:}
        base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
        chat-model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
        reasoning-model: ${OPENAI_REASONING_MODEL:gpt-4o}
        embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
      anthropic:
        api-key: ${ANTHROPIC_API_KEY:}
        base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com/v1}
        chat-model: ${ANTHROPIC_CHAT_MODEL:claude-3-5-haiku-latest}
        reasoning-model: ${ANTHROPIC_REASONING_MODEL:claude-3-5-sonnet-latest}

  audit:
    # Creates next month's audit_logs partition ahead of time.
    partition-cron: ${AUDIT_PARTITION_CRON:0 30 0 * * *}
    archive:
      # Audit history is compliance data, so old partitions are exported to object storage
      # before being dropped. Off by default: enabling it deletes local partitions.
      enabled: ${AUDIT_ARCHIVE_ENABLED:false}
      # Logs what it would archive without uploading or dropping anything.
      dry-run: ${AUDIT_ARCHIVE_DRY_RUN:true}
      retention: ${AUDIT_ARCHIVE_RETENTION:P730D}
      cron: ${AUDIT_ARCHIVE_CRON:0 0 3 1 * *}

  observability:
    # "json" for shipping to a log platform, "console" for readable local development.
    log-format: ${LOG_FORMAT:console}
    # Business-event logs kept queryable in Postgres; app logs go to the shipper.
    event-log-retention: ${LOG_EVENT_RETENTION:P90D}
    event-log-retention-cron: ${LOG_EVENT_RETENTION_CRON:0 45 2 * * *}
    slow-request-threshold: ${LOG_SLOW_REQUEST_THRESHOLD:PT1S}
    sample-rate: ${LOG_SAMPLE_RATE:1.0}

  storage:
    # S3-compatible. MinIO locally, AWS S3 in production.
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:ap-south-1}
    bucket: ${S3_BUCKET:prabhix-local}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    path-style-access: ${S3_PATH_STYLE:true}
    signed-url-ttl: PT15M

  limits:
    # Guard rails that keep a single tenant from starving the cluster.
    max-members-per-organization: 100000
    max-mailboxes-per-organization: 200
    max-attachment-size-bytes: 26214400
    default-page-size: 25
    max-page-size: 200

  files:
    scan:
      # NOOP | CLAMAV
      provider: ${FILES_SCAN_PROVIDER:NOOP}
      fail-closed-on-error: ${FILES_SCAN_FAIL_CLOSED:true}
      clamav:
        host: ${CLAMAV_HOST:localhost}
        port: ${CLAMAV_PORT:3310}
        connect-timeout-millis: ${CLAMAV_CONNECT_TIMEOUT_MS:60000}
        scan-timeout-millis: ${CLAMAV_SCAN_TIMEOUT_MS:120000}
        chunk-size: ${CLAMAV_CHUNK_SIZE:2048}

  push:
    # LOGGING | FCM | APNS
    provider: ${PUSH_PROVIDER:LOGGING}
    outbox:
      enabled: ${PUSH_OUTBOX_ENABLED:true}
      batch-size: 50
      poll-interval: PT5S
      max-attempts: 6
    fcm:
      project-id: ${FCM_PROJECT_ID:}
      # Inline JSON or base64-encoded service account JSON.
      service-account-json: ${FCM_SERVICE_ACCOUNT_JSON:}
    apns:
      team-id: ${APNS_TEAM_ID:}
      key-id: ${APNS_KEY_ID:}
      bundle-id: ${APNS_BUNDLE_ID:}
      private-key: ${APNS_PRIVATE_KEY:}
      host: ${APNS_HOST:https://api.push.apple.com}

  # Watches the Redis pub/sub path that carries every SSE stream. A cluster endpoint can retire the
  # node a subscribe connection is pinned to without telling the client, which stops chat, mail and
  # AI streams while every health check stays green. See RealtimePubSubMonitor.
  realtime:
    pubsub-monitor:
      enabled: ${REALTIME_PUBSUB_MONITOR_ENABLED:true}
      interval: ${REALTIME_PUBSUB_MONITOR_INTERVAL:PT20S}
      # Three missed probes, so a single slow tick is not mistaken for a dead subscription.
      tolerance: ${REALTIME_PUBSUB_MONITOR_TOLERANCE:PT90S}

---
# ElastiCache Serverless for Valkey is always cluster mode and always TLS, so it cannot be reached
# with the host/port settings above. Kept as its own profile rather than folded into `prod` so that
# running the prod profile against a plain Redis container still works: activate with
# SPRING_PROFILES_ACTIVE=prod,valkey.
spring:
  config:
    activate:
      on-profile: valkey
  data:
    redis:
      cluster:
        # The one serverless endpoint. The driver discovers the topology behind it, so this is a
        # single entry rather than a node list. No default: a blank endpoint should fail startup
        # loudly, not fall back to localhost and look like a working cache with no data in it.
        nodes: ${REDIS_CLUSTER_NODES}
        max-redirects: 3
      ssl:
        enabled: true
      lettuce:
        cluster:
          refresh:
            # Directly relevant to the pub/sub problem the monitor exists for: without adaptive
            # refresh the client keeps using a topology snapshot taken at startup, so it does not
            # notice that the node holding a subscribe connection has been replaced.
            adaptive: true
            period: 60s
