name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify
        run: mvn -B verify

  web:
    name: Web (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  marketing:
    name: Marketing (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketing
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: marketing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  images:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, web, marketing]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            prabhixtechnologies/prabhix-backend:latest
            prabhixtechnologies/prabhix-backend:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=https://api.prabhixtechnologies.com
            VITE_USE_MOCKS=false
          tags: |
            prabhixtechnologies/prabhix-web:latest
            prabhixtechnologies/prabhix-web:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push marketing
        uses: docker/build-push-action@v6
        with:
          context: ./marketing
          file: ./marketing/Dockerfile
          push: true
          # NEXT_PUBLIC_* is inlined at build time, so this is the only place the production
          # values can be set. ORG_SLUG and ORG_ID identify Prabhix's own tenant and are what
          # turn the storefront, chat widget and visitor beacon on.
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.prabhixtechnologies.com
            NEXT_PUBLIC_SITE_URL=https://prabhixtechnologies.com
            NEXT_PUBLIC_CONSOLE_URL=https://oneops.prabhixtechnologies.com
            NEXT_PUBLIC_MOBISTACK_URL=https://mobistack.prabhixtechnologies.com
            NEXT_PUBLIC_ORG_SLUG=${{ vars.PRABHIX_ORG_SLUG }}
            NEXT_PUBLIC_ORG_ID=${{ vars.PRABHIX_ORG_ID }}
          tags: |
            prabhixtechnologies/prabhix-marketing:latest
            prabhixtechnologies/prabhix-marketing:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
