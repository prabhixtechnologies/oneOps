name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Identity client
        uses: actions/checkout@v4
        with:
          repository: prabhixtechnologies/Identity
          path: identity-client
          sparse-checkout: client
          sparse-checkout-cone-mode: true

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: github

      - name: Install Identity starter
        run: mvn -B -f "$GITHUB_WORKSPACE/identity-client/client/pom.xml" -DskipTests install

      # -Pintegration, which clears the excludedGroups that otherwise skips the two @Tag("integration")
      # tests. They were not running here, and they are the only tests that start the Spring context
      # against a real Postgres — so nothing in CI had an opinion on whether the application could
      # boot at all.
      #
      # That gap was not theoretical. A class with two constructors and no @Autowired on either had
      # made the context unstartable: every unit test passed, the image built, and the failure would
      # have surfaced on the box as "No default constructor found" during a deploy. These two tests
      # catch that whole class of fault, and they need Docker, which this runner has.
      #
      # Logged to a file as well as the console so the next step can read it without running the suite
      # a second time. pipefail matters: without it the exit code would be tee's.
      - name: Verify
        run: |
          set -euo pipefail
          mvn -B verify -Pintegration 2>&1 | tee build.log

      # Mockito's inline mock maker instruments classes with a Byte Buddy agent, and by default it
      # attaches that agent to the JVM it is already running in. The JDK has warned about that since
      # 21 and intends to refuse it, at which point 93 test files stop working at once.
      #
      # The pom loads the agent at startup instead. Checked here rather than assumed, because the
      # failure mode is silent in the direction that matters: Mockito notices the agent is missing,
      # prints, falls back to self-attaching and passes. A green suite says nothing about whether the
      # configuration survived, so the log is the only signal until the JDK turns this into an error.
      - name: Mockito is not self-attaching
        run: |
          set -euo pipefail
          fail=0

          if grep -q 'Mockito is currently self-attaching' build.log; then
            echo "::error::Mockito is self-attaching. The -javaagent in the surefire argLine is not reaching the test JVM — check that maven-dependency-plugin's properties goal still runs."
            fail=1
          fi
          if grep -q 'A Java agent has been loaded dynamically' build.log; then
            echo "::error::An agent was loaded dynamically, which a future JDK disallows by default."
            grep -m3 'loaded dynamically' build.log
            fail=1
          fi

          # Guards against passing vacuously: a log with no tests in it has no warnings in it either.
          if ! grep -qE 'Tests run: [0-9]+' build.log; then
            echo "::error::No test results in the output, so the absence of warnings proves nothing."
            fail=1
          fi

          [ "$fail" -eq 0 ] || exit 1
          grep -hoE 'Tests run: [0-9]+, Failures: [0-9]+, Errors: [0-9]+, Skipped: [0-9]+' build.log | tail -1
          echo "The agent is loaded up front."

  # The schema is one generated baseline (Infra/deploy/squash-baseline.py), and nothing else in CI ever
  # runs it, so without this job a broken baseline reaches a real database before anyone notices.
  #
  # This is not hypothetical. Before the squash, V64 recreated an index V6 had already created, so
  # the migrations could not build an empty database at all. Every existing database was past V6 and
  # unaffected, the build was green, and the fault would have surfaced as a failed first boot on the
  # new RDS instance.
  migrations:
    name: Schema (empty database)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: schemacheck
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Baseline applies to an empty database
        run: |
          set -euo pipefail
          # --network host so the container can reach the service on localhost.
          # -placeholderReplacement=false matches spring.flyway.placeholder-replacement: the seeded
          # mail templates contain ${...} that Flyway would otherwise try to resolve.
          docker run --rm --network host \
            -v "$PWD/backend/src/main/resources/db/migration:/flyway/sql:ro" \
            flyway/flyway:11-alpine \
            -url=jdbc:postgresql://localhost:5432/schemacheck \
            -user=postgres -password=ci \
            -locations=filesystem:/flyway/sql \
            -placeholderReplacement=false \
            -connectRetries=10 \
            migrate

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Schema and seed data arrived
        env:
          PGPASSWORD: ci
        run: |
          set -euo pipefail
          # A baseline truncated to nothing still "applies" cleanly, so check it left something
          # behind. These are floors, not equalities: adding a table or a permission should not
          # fail the build, losing them should. Raise them when the schema grows.
          check() {
            actual=$(psql -h localhost -U postgres -d schemacheck -tAc "$2")
            if [ "$actual" -lt "$3" ]; then
              echo "FAIL: $1 is $actual, expected at least $3"
              exit 1
            fi
            printf '%-18s %s\n' "$1" "$actual"
          }
          # Mail lives in schema mail (V4). V7 drops the unused credential tables. The floor is
          # the public tables that remain, not the old count from when mail was still in public.
          check tables \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'" 75
          # Without these two the schema loads and every user silently has no permissions at all.
          check permissions "SELECT count(*) FROM permissions" 60
          check role_permissions "SELECT count(*) FROM role_permissions" 130
          check mail_templates "SELECT count(*) FROM mail_templates" 12
          check billing_plans "SELECT count(*) FROM billing_plans" 6

      # The baseline deliberately creates no user, so deploy/seed.sql is the whole difference between
      # an empty database and one somebody can sign in to. Run twice, because it claims to be safe to
      # run twice and the way that claim breaks here is invisible: most address columns are citext,
      # citext only casts from text on assignment, so a guard comparing a citext column to a `||`
      # expression resolves to the text operator and compares case-sensitively. First run inserts,
      # second run inserts again, nothing errors.
      - name: Seed applies twice without drift
        env:
          PGPASSWORD: ci
        run: |
          set -euo pipefail
          psql() { command psql -h localhost -U postgres -d schemacheck "$@"; }

          seed() {
            psql -q -v ON_ERROR_STOP=1 \
              -v owner_email=ci@prabhixtechnologies.com \
              -v owner_password=ci-seed-password \
              -v owner_name='CI Seed' \
              -f deploy/seed.sql > /dev/null
          }

          counts() {
            psql -tAc "SELECT concat_ws(' ',
              (SELECT count(*) FROM users),
              (SELECT count(*) FROM organization_memberships),
              (SELECT count(*) FROM platform_staff_roles),
              (SELECT count(*) FROM mail_domains),
              (SELECT count(*) FROM mail_mailboxes),
              (SELECT count(*) FROM mail_aliases),
              (SELECT count(*) FROM mail_mailbox_members))"
          }

          seed; first=$(counts)
          seed; second=$(counts)
          echo "users memberships staff domains mailboxes aliases members"
          echo "after one run:  $first"
          echo "after two runs: $second"
          if [ "$first" != "$second" ]; then
            echo "FAIL: the seed is not idempotent"
            exit 1
          fi

      # What the counts cannot see. A seeded owner who cannot sign in, or who signs in with no staff
      # role, leaves an admin console that is reachable and empty.
      - name: Seeded owner can sign in and is staff
        env:
          PGPASSWORD: ci
        run: |
          set -euo pipefail
          psql() { command psql -h localhost -U postgres -d schemacheck "$@"; }

          expect() {
            actual=$(psql -tAc "$2")
            if [ "$actual" != "$3" ]; then
              echo "FAIL: $1 is '$actual', expected '$3'"
              exit 1
            fi
            printf '%-34s %s\n' "$1" "$actual"
          }

          # The account password lives in Identity. What this seed still hashes is the mailbox
          # credential Dovecot checks. crypt() against that stored hash is the real check, and the
          # cost matters: a weaker hash still verifies, so nothing else would notice the drift.
          expect "mailbox password verifies" \
            "SELECT crypt('ci-seed-password', password_hash) = password_hash FROM mail.mail_mailboxes WHERE address = 'ci@prabhixtechnologies.com'" t
          expect "a wrong mailbox password does not" \
            "SELECT crypt('wrong', password_hash) = password_hash FROM mail.mail_mailboxes WHERE address = 'ci@prabhixtechnologies.com'" f
          expect "mailbox bcrypt cost is 12" \
            "SELECT left(password_hash, 7) FROM mail.mail_mailboxes WHERE address = 'ci@prabhixtechnologies.com'" '$2a$12$'
          expect "platform user has no password column" \
            "SELECT count(*) FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'users' AND column_name = 'password_hash'" 0
          expect "platform_admin is set" \
            "SELECT platform_admin FROM users WHERE email = 'ci@prabhixtechnologies.com'" t
          expect "holds the OWNER staff role" \
            "SELECT role FROM platform_staff_roles s JOIN users u ON u.id = s.user_id WHERE u.email = 'ci@prabhixtechnologies.com' AND s.revoked_at IS NULL" OWNER
          expect "is an OWNER of the organization" \
            "SELECT r.role_key FROM organization_memberships m JOIN roles r ON r.id = m.role_id JOIN users u ON u.id = m.user_id WHERE u.email = 'ci@prabhixtechnologies.com'" OWNER

          # The citext case above, stated as a test. A mixed-case address must resolve to the mailbox
          # that already exists rather than looking absent and being created a second time.
          expect "addresses are case-insensitive" \
            "SELECT count(*) FROM mail_mailboxes WHERE address = 'SUPPORT@prabhixtechnologies.com'" 1
          expect "every alias points at a real mailbox" \
            "SELECT count(*) FROM mail_aliases a LEFT JOIN mail_mailboxes m ON m.id = a.mailbox_id WHERE m.id IS NULL" 0

      # Identity signs the token and this database is looked up by the uuid in its `sub`, so the two
      # seeds have to agree on the owner's id. They live in separate repositories and no foreign key
      # spans the two databases, so nothing can enforce it — this pins the value on this side, and
      # Identity's own CI pins the same literal on that side. Changing it needs both, deliberately.
      - name: Owner id matches the value Identity seeds
        env:
          PGPASSWORD: ci
        run: |
          set -euo pipefail
          expected=00000000-0000-4000-8000-000000000002
          actual=$(psql -h localhost -U postgres -d schemacheck -tAc \
            "SELECT id FROM users WHERE email = 'ci@prabhixtechnologies.com'")
          if [ "$actual" != "$expected" ]; then
            echo "FAIL: deploy/seed.sql produced owner id $actual, but Identity/deploy/seed.sql"
            echo "      defaults to $expected. Change both or neither: a mismatch lets sign-in"
            echo "      succeed and then fails every API call with 'not provisioned on the platform'."
            exit 1
          fi
          echo "owner id $actual, matching Identity"

      # The guard against seeding the pair inconsistently, which is the mistake with the worst
      # symptom and no error. Reseeding this address under a different id has to be refused, because
      # the alternative is that it looks like it worked: the insert is guarded on the address, so it
      # skips, the script exits 0, and the id that was passed is silently not the id in the database.
      #
      # Tested by doing it, because a check written and never exercised is a check that might already
      # be inverted.
      - name: Seeding the same address under a different id is refused
        env:
          PGPASSWORD: ci
        run: |
          set -euo pipefail
          before=$(psql -h localhost -U postgres -d schemacheck -tAc \
            "SELECT id FROM users WHERE email = 'ci@prabhixtechnologies.com'")

          if psql -h localhost -U postgres -d schemacheck -q \
               -v ON_ERROR_STOP=1 \
               -v owner_email=ci@prabhixtechnologies.com \
               -v owner_password=ci-seed-password \
               -v owner_name='CI Seed' \
               -v owner_id=00000000-0000-4000-8000-0000000000ff \
               -f deploy/seed.sql > /dev/null 2>&1; then
            echo "FAIL: the seed accepted a different owner_id for an address it had already seeded."
            echo "      It must refuse, or the two databases can disagree about who the owner is"
            echo "      while both scripts report success."
            exit 1
          fi

          after=$(psql -h localhost -U postgres -d schemacheck -tAc \
            "SELECT id FROM users WHERE email = 'ci@prabhixtechnologies.com'")
          if [ "$before" != "$after" ]; then
            echo "FAIL: the refused run still changed the id, from $before to $after"
            exit 1
          fi
          echo "refused, and left the existing id alone"

  web:
    name: Web (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: |
          git clone --depth 1 https://github.com/prabhixtechnologies/web-kit.git "$GITHUB_WORKSPACE/../web-kit"
          npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # The suite existed but nothing ran it here, so a failing test only showed up for whoever
      # happened to run vitest locally.
      - name: Test
        run: npm run test

      - name: Build OneOps
        run: npm run build && mv dist dist-oneops

      # Built separately because the two entry points import different route tables, so a break in
      # the admin-only pages does not show up in the OneOps build at all.
      - name: Build admin
        run: npm run build:admin && mv dist dist-admin

      # The web half of the split, guarded in both directions.
      #
      # Neither failure mode is visible: the OneOps bundle carrying staff endpoints looks fine, and
      # so does the admin bundle carrying the entire product — which is what shipped twice, because
      # a module-scope `lazy(() => import(...))` is emitted into every bundle that imports the file
      # declaring it, whether or not a route reaches it. Hence routes-tenant.tsx.
      #
      # Each string is asserted present on the side that should have it before being asserted absent
      # on the other, so renaming an endpoint cannot quietly turn this into a test of nothing.
      - name: Check neither bundle contains the other's code
        run: |
          fail=0
          check() {
            local present="$1" absent="$2" needle="$3"
            if ! grep -rqa -- "$needle" "$present/assets"; then
              echo "::error::'$needle' is missing from $present, so testing for its absence in $absent proves nothing. Update this list."
              fail=1
            elif grep -rqa -- "$needle" "$absent/assets"; then
              echo "::error::$absent contains '$needle', which belongs only to $present."
              fail=1
            fi
          }

          # Staff-only surfaces must not reach the customer product.
          for needle in 'admin/platform/tenants' 'admin/site/leads' 'Ops Hub'; do
            check dist-admin dist-oneops "$needle"
          done

          # The product must not be in the staff console.
          #
          # '/mail/threads' used to be on this list and is not any more: mail left OneOps for
          # Mailroom, so the string is absent from both bundles and the check would have been
          # asserting nothing. '/visitors/analytics' replaced it. Note the path, not the bare
          # '/visitors' -- the staff console does route on that prefix, so the shorter string is
          # present on both sides and would fail this check for the wrong reason.
          for needle in '/commerce/orders' '/commerce/products' '/visitors/analytics' '/chat/conversations' '/billing/subscription'; do
            check dist-oneops dist-admin "$needle"
          done

          [ "$fail" -eq 0 ] || exit 1
          echo "Neither bundle contains the other's code."

  openapi:
    name: OpenAPI client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/oneops-api
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/oneops-api/package-lock.json
      - name: Install
        run: npm ci
      - name: Generate TypeScript client
        run: npm run generate
      - name: Fail if the snapshot or generated client drifted
        run: |
          set -euo pipefail
          git diff --exit-code --ignore-cr-at-eol -- src/schema.ts ../../backend/apidocs.json
          node -e "
            const s = require('../../backend/apidocs.json').components.schemas;
            for (const n of ['ProductSummary','CartView','OrderDetail']) {
              if (!s[n]) { console.error('apidocs.json is missing schema ' + n); process.exit(1); }
            }
            console.log('commerce schemas present');
          "

  contract:
    name: API contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      # Always runs the mocked commerce fixtures in contract.live.test.ts.
      # Live GETs run when CONTRACT_LIVE=1 (repo variable) and PBX_CONTRACT_* secrets are set.
      - name: Contract check
        env:
          CONTRACT_LIVE: ${{ vars.CONTRACT_LIVE }}
          PBX_CONTRACT_EMAIL: ${{ secrets.PBX_CONTRACT_EMAIL }}
          PBX_CONTRACT_PASSWORD: ${{ secrets.PBX_CONTRACT_PASSWORD }}
          PBX_CONTRACT_API: ${{ vars.PBX_CONTRACT_API }}
          PBX_CONTRACT_ORIGIN: ${{ vars.PBX_CONTRACT_ORIGIN }}
        run: npx vitest run src/lib/schemas/contract.live.test.ts

  e2e-dry-run:
    name: Playwright E2E (dry-run)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      # Installs the runner and typechecks specs. Does not start a stack or a browser.
      - name: Playwright CLI is present
        run: npx playwright --version
      - name: Typecheck E2E specs
        run: npx tsc -p e2e --noEmit

  # Live journeys need a seeded stack (Identity + marketing + oneOps + mailroom). Off unless the
  # repository variable is set, matching CONTRACT_LIVE.
  e2e-live:
    name: Playwright E2E (live)
    if: ${{ vars.E2E_LIVE == '1' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run live loops
        env:
          E2E_LIVE: "1"
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_MARKETING_URL: ${{ vars.E2E_MARKETING_URL }}
          E2E_IDENTITY_URL: ${{ vars.E2E_IDENTITY_URL }}
          E2E_AGENT_EMAIL: ${{ secrets.E2E_AGENT_EMAIL }}
          E2E_AGENT_PASSWORD: ${{ secrets.E2E_AGENT_PASSWORD }}
        run: npx playwright test

  images:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, migrations, web, openapi, contract]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      # Lets the job mint a short-lived OIDC token for AWS to exchange for temporary credentials.
      # Without it the role assumption below fails with a token error rather than an access error,
      # which is a confusing way to find out.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Prints the claims AWS compares the trust policy against, and nothing else.
      #
      # Kept after the migration rather than deleted with the rest of the scaffolding, because it is
      # the only way to see why an assumption was refused. Six runs failed with "Not authorized to
      # perform sts:AssumeRoleWithWebIdentity" while every observable input was correct, and two
      # unrelated causes were hiding behind that one message: this account issues immutable subject
      # claims of the form repo:owner@320051589/name@1349569564:ref:..., which no documented pattern
      # matches, and a repository_owner equality check that never matched a value the logs mask.
      # STS never names the claim it rejected and cloudtrail:LookupEvents is not granted to the
      # deployer, so without this step the next failure is guesswork again. See
      # deploy/aws/README-iam.md.
      #
      # Only the decoded payload is echoed. The token itself is a bearer credential and is never
      # printed; the claims are identifiers, and the job is already restricted to pushes on main.
      - name: Show the OIDC claims AWS will see
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString('utf8')
            );
            for (const key of ['iss', 'aud', 'sub', 'repository', 'repository_owner', 'ref', 'event_name', 'workflow_ref']) {
              core.info(`${key} = ${JSON.stringify(payload[key])}`);
            }

      # Amazon ECR is the only registry. The Docker Hub branch that used to sit here is gone, along
      # with the AWS_CI_ROLE_ARN variable that chose between them — with one registry that variable
      # stopped being a cutover switch and became a way for a repository to be silently
      # misconfigured, since an unset variable meant "push somewhere else" rather than "fail".
      #
      # The role ARN is written here rather than read from a variable for the same reason. The
      # account ID is already committed in deploy/aws/*.json and is not a secret.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::029096972251:role/prabhix-github-ecr-push
          # ap-south-1 because the EC2 instance is there. Pulling across regions is charged as
          # inter-region transfer on every deploy, for no benefit.
          aws-region: ap-south-1

      # No long-lived key anywhere: the role is assumed through GitHub's OIDC provider, and the
      # docker credentials this produces expire in twelve hours.
      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker metadata
        id: meta
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # The login action reports the registry host for the account the role belongs to, so the
          # account ID is not written down a second time and cannot drift from the role above.
          #
          # Repositories are namespaced — prabhix/backend — and the slash is required rather than
          # tidy: the deployer policy scopes ECR to repository/prabhix/*, and that pattern only
          # matches a name containing a slash. Creating prabhix-backend came back AccessDenied
          # against the real account while prabhix/probe succeeded.
          echo "base=${{ steps.ecr.outputs.registry }}/prabhix" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          build-contexts: |
            identity-client=https://github.com/prabhixtechnologies/Identity.git#main:client
          push: true
          tags: |
            ${{ steps.meta.outputs.base }}/backend:latest
            ${{ steps.meta.outputs.base }}/backend:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./web/Dockerfile
          build-contexts: |
            webkit=https://github.com/prabhixtechnologies/web-kit.git#main
          push: true
          # Vite inlines these at build time; each must also be declared as an ARG in web/Dockerfile
          # or it is silently discarded.
          build-args: |
            APP=oneops
            VITE_API_URL=https://api.prabhixtechnologies.com
            VITE_RAZORPAY_KEY_ID=${{ vars.RAZORPAY_KEY_ID }}
            VITE_GOOGLE_SSO_ENABLED=false
            VITE_MAILROOM_URL=https://mail.prabhixtechnologies.com
          tags: |
            ${{ steps.meta.outputs.base }}/web:latest
            ${{ steps.meta.outputs.base }}/web:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same context and Dockerfile as web; APP picks the entry point, so the two images differ in
      # which routes they contain. No Razorpay key — the admin app has no checkout.
      - name: Build and push admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./web/Dockerfile
          build-contexts: |
            webkit=https://github.com/prabhixtechnologies/web-kit.git#main
          push: true
          build-args: |
            APP=admin
