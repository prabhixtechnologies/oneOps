name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify
        run: mvn -B verify

  web:
    name: Web (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # The suite existed but nothing ran it here, so a failing test only showed up for whoever
      # happened to run vitest locally.
      - name: Test
        run: npm run test

      - name: Build OneOps
        run: npm run build && mv dist dist-oneops

      # Built separately because the two entry points import different route tables, so a break in
      # the admin-only pages does not show up in the OneOps build at all.
      - name: Build admin
        run: npm run build:admin && mv dist dist-admin

      # The web half of the split, guarded in both directions.
      #
      # Neither failure mode is visible: the OneOps bundle carrying staff endpoints looks fine, and
      # so does the admin bundle carrying the entire product — which is what shipped twice, because
      # a module-scope `lazy(() => import(...))` is emitted into every bundle that imports the file
      # declaring it, whether or not a route reaches it. Hence routes-tenant.tsx.
      #
      # Each string is asserted present on the side that should have it before being asserted absent
      # on the other, so renaming an endpoint cannot quietly turn this into a test of nothing.
      - name: Check neither bundle contains the other's code
        run: |
          fail=0
          check() {
            local present="$1" absent="$2" needle="$3"
            if ! grep -rqa -- "$needle" "$present/assets"; then
              echo "::error::'$needle' is missing from $present, so testing for its absence in $absent proves nothing. Update this list."
              fail=1
            elif grep -rqa -- "$needle" "$absent/assets"; then
              echo "::error::$absent contains '$needle', which belongs only to $present."
              fail=1
            fi
          }

          # Staff-only surfaces must not reach the customer product.
          for needle in 'admin/platform/tenants' 'admin/site/leads' 'Ops Hub'; do
            check dist-admin dist-oneops "$needle"
          done

          # The product must not be in the staff console.
          for needle in '/commerce/orders' '/mail/threads' '/chat/conversations' '/billing/subscription'; do
            check dist-oneops dist-admin "$needle"
          done

          [ "$fail" -eq 0 ] || exit 1
          echo "Neither bundle contains the other's code."

  marketing:
    name: Marketing (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketing
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: marketing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  android:
    name: Android (Gradle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4

      # 17, not the 21 the backend uses: the Android Gradle Plugin pins its supported JDK range and
      # rejects newer ones outright.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Both flavors, because they compile different source sets: the platform screens and the
      # cross-tenant API exist only under src/admin, so a break in them is invisible to the OneOps
      # build. Debug rather than release — release needs the signing keystore, which is not in the
      # repository, and would produce an unsigned APK that tells us nothing more than this does.
      - name: Assemble both flavors
        run: ./gradlew --no-daemon assembleOneopsDebug assembleAdminDebug

      # Cheap insurance for the split. The customer's app must not contain the staff endpoints, and
      # the way that breaks is silent: move one file back into src/main and both APKs build fine.
      #
      # The admin APK is checked for the same string first, so the check cannot pass vacuously. Were
      # only the OneOps side asserted, renaming the endpoint would turn this into a test that always
      # passes while protecting nothing.
      - name: Check neither build contains the other's code
        run: |
          dex() { unzip -p "app/build/outputs/apk/$1/debug/app-$1-debug.apk" 'classes*.dex'; }

          dex admin  > /tmp/admin.dex
          dex oneops > /tmp/oneops.dex

          fail=0

          # Direction 1: the customer's app must not contain the staff endpoints.
          #
          # Asserted against the admin APK first so the check cannot pass vacuously. Were only the
          # OneOps side tested, renaming the endpoint would turn this into a test that always passes
          # while protecting nothing.
          if ! grep -qa 'admin/platform/' /tmp/admin.dex; then
            echo "::error::The admin APK no longer references admin/platform endpoints, so the OneOps check proves nothing. Update the string this job greps for."
            fail=1
          elif grep -qa 'admin/platform/' /tmp/oneops.dex; then
            echo "::error::The OneOps APK references admin/platform endpoints. Platform admin code must live in app/src/admin."
            fail=1
          fi

          # Direction 2: the staff app must not contain the product. This is the one that broke
          # twice, and neither time was visible — the screens were unreachable while the Retrofit
          # APIs, the Room database and the SSE client were all still compiled in, because a Hilt
          # provider in src/main kept them reachable from both graphs.
          for needle in 'chat/conversations' 'mail/threads' 'chat/stream' 'prabhix_operator.db' 'outbound_flush'; do
            if ! grep -qa "$needle" /tmp/oneops.dex; then
              echo "::error::'$needle' is missing from the OneOps APK, so testing for its absence in admin proves nothing. Update this list."
              fail=1
            elif grep -qa "$needle" /tmp/admin.dex; then
              echo "::error::The admin APK contains '$needle'. The product belongs in app/src/oneops; check for a @Provides or an injection in src/main that reaches it."
              fail=1
            fi
          done

          [ "$fail" -eq 0 ] || exit 1
          echo "Neither APK contains the other's code."

      # So a build can be installed on a phone without a local Android toolchain. Debug-signed, so
      # they install directly but cannot be uploaded to Play.
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apks
          path: mobile/android/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  images:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, web, marketing]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            prabhixtechnologies/prabhix-backend:latest
            prabhixtechnologies/prabhix-backend:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          # Vite inlines these at build time; each must also be declared as an ARG in web/Dockerfile
          # or it is silently discarded.
          build-args: |
            APP=oneops
            VITE_API_URL=https://api.prabhixtechnologies.com
            VITE_RAZORPAY_KEY_ID=${{ vars.RAZORPAY_KEY_ID }}
            VITE_GOOGLE_SSO_ENABLED=false
          tags: |
            prabhixtechnologies/prabhix-web:latest
            prabhixtechnologies/prabhix-web:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same context and Dockerfile as web; APP picks the entry point, so the two images differ in
      # which routes they contain. No Razorpay key — the admin app has no checkout.
      - name: Build and push admin
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          build-args: |
            APP=admin
            VITE_API_URL=https://api.prabhixtechnologies.com
            VITE_GOOGLE_SSO_ENABLED=false
            VITE_ONEOPS_URL=https://oneops.prabhixtechnologies.com
          tags: |
            prabhixtechnologies/prabhix-admin:latest
            prabhixtechnologies/prabhix-admin:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push marketing
        uses: docker/build-push-action@v6
        with:
          context: ./marketing
          file: ./marketing/Dockerfile
          push: true
          # NEXT_PUBLIC_* is inlined at build time, so this is the only place the production
          # values can be set. ORG_SLUG and ORG_ID identify Prabhix's own tenant and are what
          # turn the storefront, chat widget and visitor beacon on.
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.prabhixtechnologies.com
            NEXT_PUBLIC_SITE_URL=https://prabhixtechnologies.com
            NEXT_PUBLIC_CONSOLE_URL=https://oneops.prabhixtechnologies.com
            NEXT_PUBLIC_MOBISTACK_URL=https://mobistack.prabhixtechnologies.com
            NEXT_PUBLIC_ORG_SLUG=${{ vars.PRABHIX_ORG_SLUG }}
            NEXT_PUBLIC_ORG_ID=${{ vars.PRABHIX_ORG_ID }}
          tags: |
            prabhixtechnologies/prabhix-marketing:latest
            prabhixtechnologies/prabhix-marketing:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
