# iOS build, deliberately manual.
#
# Not in ci.yml and not triggered by push or pull_request, for two reasons:
#
#   1. The Swift under mobile/ios has never been compiled — it was written entirely from a Windows
#      machine, where Xcode does not run. The first run of this workflow is expected to fail with a
#      real list of errors. Wiring that into the main pipeline would block every unrelated change.
#   2. macOS runners bill at ten times the Linux rate. Paying that on every push, for a target that
#      does not build yet, buys nothing.
#
# So this exists to be the build path itself: iOS was blocked on tooling rather than on decisions,
# and one `workflow_dispatch` here is what unblocks it without a Mac on anyone's desk. Run it, work
# through the errors, and once it is green move it into ci.yml as a required check.
name: iOS

on:
  workflow_dispatch:
    inputs:
      scheme:
        description: Which app to build
        type: choice
        default: both
        options: [both, PrabhixOperator, PrabhixAdmin]

jobs:
  build:
    name: Xcode build
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile/ios
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.app

      - name: Install XcodeGen
        run: brew install xcodegen

      # Real signing needs an Apple Developer account and secrets in the repository. Simulator
      # builds need neither, and they still compile every line, which is the whole point here.
      - name: Write Config.xcconfig
        run: |
          cp Config.xcconfig.template Config.xcconfig
          echo 'CODE_SIGNING_REQUIRED = NO' >> Config.xcconfig
          echo 'CODE_SIGNING_ALLOWED = NO' >> Config.xcconfig
          echo 'CODE_SIGN_IDENTITY = ' >> Config.xcconfig

      - name: Generate the project
        run: xcodegen generate

      # Cheapest possible first signal: no simulator, no signing, no app target. If Core does not
      # parse, nothing below can pass, and this fails in a fraction of the time.
      - name: Compile the Core package
        run: swift build

      - name: Build
        run: |
          case "${{ inputs.scheme }}" in
            both) schemes="PrabhixOperator PrabhixAdmin" ;;
            *)    schemes="${{ inputs.scheme }}" ;;
          esac

          for scheme in $schemes; do
            echo "::group::$scheme"
            xcodebuild \
              -project PrabhixOperator.xcodeproj \
              -scheme "$scheme" \
              -destination 'platform=iOS Simulator,name=iPhone 16' \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO \
              build
            echo "::endgroup::"
          done

      # The same audit the Android job runs, for the same reason: the customer's app must not contain
      # the staff endpoints, and that breaks silently. Kept as a warning rather than a failure until
      # the admin screens exist — right now both targets legitimately build identical code, so
      # asserting a difference would be asserting something untrue.
      - name: Check the OneOps app contains no platform admin code
        if: inputs.scheme == 'both'
        run: |
          app=$(find ~/Library/Developer/Xcode/DerivedData -name 'PrabhixOperator.app' -type d | head -1)
          if [ -z "$app" ]; then
            echo "::warning::Could not locate the built OneOps app, skipping the leak check."
            exit 0
          fi

          if grep -qa 'admin/platform/' "$app/PrabhixOperator"; then
            echo "::error::The OneOps app references admin/platform endpoints. Platform admin code must be in the admin target only."
            exit 1
          fi

          echo "OneOps app is clean."
