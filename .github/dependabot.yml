version: 2

# Automated dependency updates and vulnerability patches.
#
# Nothing watched dependencies before this: a published advisory in a transitive package would have
# sat here indefinitely, because no build step and no schedule ever looked. Every ecosystem in the
# repo is listed, since an unlisted one is silently unwatched — the failure mode is no signal rather
# than an error, which is exactly the kind that goes unnoticed for a year.
#
# Grouping matters as much as coverage. Ungrouped, this raises dozens of single-package pull requests
# a week across five manifests, they get ignored as noise, and the setup is worse than none because
# it looks like it is working. Patch and minor updates therefore arrive as one pull request per
# ecosystem; majors come separately, since those need reading.
#
# Note that this file only governs *updates*. Alerting on advisories is a repository setting
# (Settings > Code security > Dependabot alerts) and has to be switched on there once.
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      backend-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      backend-security:
        applies-to: security-updates
        patterns: ["*"]
    # OGNL is pinned to 3.3.x by Thymeleaf, which calls an OgnlContext constructor that 3.4
    # changed -- the reasoning is on the pin in backend/pom.xml. Without this, every weekly run
    # re-proposes 3.4.x inside the minor-and-patch group, and because the group is one pull
    # request it takes four healthy bumps down with it. Ignoring only the majors would not help:
    # 3.3 to 3.4 is a minor version.
    ignore:
      - dependency-name: "ognl:ognl"
        versions: [">=3.4.0"]
    labels: [dependencies, backend]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      web-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      web-security:
        applies-to: security-updates
        patterns: ["*"]
    labels: [dependencies, web]

# There was a gradle entry for /mobile/android here. That directory is not in this repository, so
# the weekly run failed every time with nothing to look at. A permanently red Dependabot job is
# worse than a missing one: it trains you to ignore the update runs, which is where a real advisory
# would show up.
#
# It also hid a real gap. The Android code lives in Mobile, and that repository had no Dependabot
# configuration at all -- so this entry made Android look watched while nothing was watching it.
# Mobile/.github/dependabot.yml now covers its four Gradle trees, its pubspecs and its workflows.
  # Actions pinned by tag drift out of support quietly, and a deprecated runner action fails the
  # whole pipeline the day it is switched off rather than warning first.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, ci]

  # Base images are where most inherited CVEs live, and they are invisible to the language
  # ecosystems above: nothing else in this file would notice nginx or the JRE going stale.
  - package-ecosystem: docker
    directories:
      - /backend
      - /web
    schedule:
      interval: weekly
      day: monday
    groups:
      base-images:
        patterns: ["*"]
    labels: [dependencies, docker]
